<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Title Information -->
    <title>Bassam Fahad Resume</title>

    <!-- Character Encoding Information -->
    <meta charset="UTF-8">

    <!-- Description Information -->
    <meta name="description" content="Bassam Fahad Resume">

    <!-- Keywords Information -->
    <meta name="keywords" content="Bassam, Fahad, Resume, Personal Website">

    <!-- Author Information -->
    <meta name="author" content="Bassam Fahad Abdulaziz Ahmed">

    <!-- Viewport Information -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #222;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);

            /* Flexbox */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .logo {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin: 10px 0 4px;
            color: #1a2b4c;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* CSS Grid */
        .info {
            width: 100%;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info p {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            background-color: #f4f6f9;
            padding: 12px;
            border-radius: 8px;
        }

        .info b {
            color: #1a2b4c;
        }

        /* Guessing Game Button */
        .game-button {
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #1a2b4c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .game-button:hover {
            background-color: #3b5998;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logo (SVG) -->
        <div class="logo">
            <svg width="90" height="90" viewBox="0 0 90 90"
                 xmlns="http://www.w3.org/2000/svg">

                <circle cx="45" cy="45" r="43"
                        fill="#1a2b4c"
                        stroke="#3b5998"
                        stroke-width="2"/>

                <text x="50%" y="55%"
                      text-anchor="middle"
                      dy=".35em"
                      font-family="Segoe UI, Arial, sans-serif"
                      font-size="30"
                      font-weight="bold"
                      fill="#ffffff">
                    BF
                </text>
            </svg>
        </div>

        <!-- Resume Information -->
        <h1>Bassam Fahad Abdulaziz Ahmed</h1>

        <p class="subtitle">
            Information Technology (IT)
        </p>

        <div class="info">

            <!-- Major Information -->
            <p>
                <b>Major:</b> Information Technology (IT)
            </p>

            <!-- Languages Information -->
            <p>
                <b>Languages:</b> Arabic, English
            </p>

            <!-- Programming Languages Information -->
            <p>
                <b>Programming Languages:</b> HTML, CSS, JavaScript
            </p>

            <!-- Projects Information -->
            <p>
                <b>Projects:</b> Football Field Booking Website
            </p>

            <!-- Activities Information -->
            <p>
                <b>Activities:</b> Web Technology Course
            </p>

        </div>

        <!-- Guessing Game Button -->
        <button class="game-button" onclick="guessingGame()">
            Play Guessing Game
        </button>

    </div>


    <!-- JavaScript Guessing Game -->
    <script>

        function guessingGame() {

            // Computer chooses a random number from 0 to 10
            let number = Math.floor(Math.random() * 11);

            // Variable for player's guess
            let guess;

            // Ask the player to guess
            do {

                guess = Number(
                    prompt("Guess a number between 0 and 10:")
                );

                // Check the guess
                if (guess === number) {

                    alert("Yeah, you guessed it!");

                } 
                else if (guess < number) {

                    alert("Too low, try again");

                } 
                else {

                    alert("Too high, try again");

                }

            } while (guess !== number);


            // Ask if the player wants to play again
            let playAgain = prompt(
                "Do you want to play again? (yes/no)"
            );


            // Play again or quit
            if (playAgain.toLowerCase() === "yes") {

                guessingGame();

            } 
            else {

                alert("Goodbye!");

            }
        }

    </script>

</body>
</html>
